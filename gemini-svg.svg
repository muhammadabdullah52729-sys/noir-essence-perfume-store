<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g fill="none" stroke="#D4AF37" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Cap / Stopper Section -->
    <!-- Outer Cap Contour -->
    <path stroke-width="2.5" d="M 216,75 L 296,75 L 296,125 L 216,125 Z" />
    <!-- Inner Fine Inset Box -->
    <path stroke-width="1.25" d="M 221,80 L 291,80 L 291,120 L 221,120 Z" />

    <!-- Neck / Collar Section -->
    <!-- Top Neck Ring -->
    <path stroke-width="2" d="M 236,125 L 276,125" />
    <!-- Neck Connector Lines -->
    <path stroke-width="2" d="M 240,125 L 240,150 M 272,150 L 272,125" />
    <!-- Lower Collar Ring -->
    <path stroke-width="2.5" d="M 230,150 L 282,150" />

    <!-- Bottle Body (Geometric Faceted / Emerald Cut Silhouette) -->
    <!-- Main Outer Contour -->
