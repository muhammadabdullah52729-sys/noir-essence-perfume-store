      M 362,185 L 350,193 
      M 150,395 L 162,388 
      M 362,395 L 350,388 
      M 185,430 L 192,418 
      M 327,430 L 320,418" />

    <!-- Integrated Luxury Monogram "N" -->
    <!-- Left Vertical Stem -->
    <path stroke-width="3" d="M 210,230 L 210,350" />
    <!-- Right Vertical Stem -->
    <path stroke-width="3" d="M 302,230 L 302,350" />
    <!-- Diagonal Stroke -->
    <path stroke-width="2.5" d="M 210,230 L 302,350" />

    <!-- Monogram Serifs / End Caps -->
    <!-- Top-Left Serif -->
    <path stroke-width="1.5" d="M 203,230 L 217,230" />
    <!-- Bottom-Left Serif -->
    <path stroke-width="1.5" d="M 203,350 L 217,350" />
    <!-- Top-Right Serif -->
    <path stroke-width="1.5" d="M 295,230 L 309,230" />
    <!-- Bottom-Right Serif -->
